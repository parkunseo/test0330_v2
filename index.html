<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Design Archive</title>
    <style>
        /* 1. 핑크 그라데이션 디자인 시스템 */
        :root {
            --main-pink: #ff85a2;      /* 메인 진분홍 */
            --light-pink: #ffdae0;     /* 배경 연분홍 */
            --deep-pink: #f15c7d;      /* 강조 핫핑크 */
            --soft-white: #fff9fa;     /* 핑크빛 도는 흰색 */
            --shadow-pink: rgba(255, 133, 162, 0.2);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--light-pink);
            background-image: radial-gradient(circle at 20% 30%, #ffeef2 0%, var(--light-pink) 100%);
            font-family: 'Pretendard', sans-serif;
            color: #5d3f46; /* 진한 팥죽색 느낌의 핑크 브라운 (가독성용) */
            padding: 40px 20px;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        header h1 {
            text-align: center;
            font-size: 3.5rem;
            color: var(--deep-pink);
            margin-bottom: 40px;
            text-shadow: 3px 3px 0px white;
            letter-spacing: 2px;
        }

        /* 2. 메인 레이아웃 */
        .container {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 25px;
        }

        main {
            background: var(--soft-white);
            border-radius: 40px;
            padding: 45px;
            border: 2px solid white;
            box-shadow: 15px 15px 30px var(--shadow-pink);
        }

        /* 3. 섹션 및 카드 스타일 */
        section { margin-bottom: 50px; }

        h2 {
            font-size: 1.6rem;
            color: var(--deep-pink);
            margin-bottom: 25px;
            display: inline-block;
            border-bottom: 4px dotted var(--main-pink);
        }

        .pink-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            border: 1px solid var(--light-pink);
            transition: var(--transition);
        }

        .pink-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px var(--shadow-pink);
        }

        /* 4. 버튼형 리스트 */
        .tag-container { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .tag {
            background: var(--light-pink);
            color: var(--deep-pink);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
        }

        /* 5. 핑크 테이블 (이게 포인트!) */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 20px;
            overflow: hidden;
