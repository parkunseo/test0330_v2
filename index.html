<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>디자인 소개</title>
<style>
    /* 1. 디자인 시스템 변수 설정 (전문가용 핑크 테마) */
    :root {
        --main-pink: #ff85a2;      /* 생기 있는 메인 핑크 */
        --deep-pink: #f15c7d;      /* 강조용 진분홍 */
        --light-pink: #fff0f3;     /* 아주 연한 배경 핑크 */
        --point-pink: #ffdae0;     /* 서브 핑크 */
        --text-brown: #5d4046;     /* 가독성 좋은 딥 로즈 브라운 */
        --glass-white: rgba(255, 255, 255, 0.9);
        --shadow-pink: rgba(255, 133, 162, 0.3);
        --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 전체 레이아웃 리셋 및 부드러운 배경 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        background-color: #ffd6e0;
        background-image: linear-gradient(135deg, #ffeef2 0%, #ffd6e0 100%);
        font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        color: var(--text-brown);
        line-height: 1.8;
        padding: 60px 20px;
    }

    /* 중앙 정렬 컨테이너 */
    .wrapper {
        max-width: 800px;
        margin: 0 auto;
    }

    /* 2. 제목 스타일링 (그라데이션 & 그림자) */
    h1 {
        font-size: 3rem;
        text-align: center;
        margin-bottom: 50px;
        background: linear-gradient(45deg, var(--deep-pink), var(--main-pink));
        -webkit-background-clip: text;
        color: transparent;
