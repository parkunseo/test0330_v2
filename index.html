<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Design Portfolio</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Pretendard', sans-serif;
    background: linear-gradient(135deg, #ffd6e0, #fff0f5);
    color: #333;
}
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #ff9bb3, #ffc1d3);
    text-align: center;
    color: white;
}
.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}
.hero p {
    font-size: 18px;
    opacity: 0.9;
}
.container {
    padding: 60px 20px;
}
.card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.6);
    border-radius: 20px;
    padding: 30px;
    margin: 30px auto;
    max-width: 500px;
    
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);

    transform: translateY(40px);
    opacity: 0;
    transition: 0.6s;
}
.card.show {
    transform: translateY(0);
    opacity: 1;
}
.card:hover {
    transform: scale(1.03);
}
h2 {
    color: #ff4f87;
    margin-bottom: 15px;
}
.profile-img {
    width: 180px;
    border-radius: 50%;
    display: block;
    margin: 30px auto;
    transition: 0.5s;
}
.profile-img:hover {
    transform: scale(1.1);
}
ul {
    list-style: none;
}
ul li {
    margin: 8px 0;
}
table {
    margin: 20px auto;
    border-collapse: collapse;
}
th {
    background: #ff4f87;
    color: white;
    padding: 10px;
}
td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 20px;
    background: #ff4f87;
    color: white;
    border-radius: 20px;
    text-decoration: none;
    transition: 0.3s;
}
.btn:hover {
    background: #ff2f6d;
}
</style>
</head>
<body>
<section class="hero">
    <h1>Design</h1>
    <p>감정과 경험을 설계하는 디자인</p>
</section>
<div class="container">
<img src="images/IMG_9267.jpeg" class="profile-img">
<div class="card">
<h2>디자인의 의미</h2>
<p>디자인은 단순한 시각적 표현이 아닌 경험을 설계하는 과정입니다.</p>
</div>
<div class="card">
<h2>디자인 요소</h2>
<ul>
<li>전달력</li>
<li>가독성</li>
<li>스토리텔링</li>
</ul>
</div>
<div class="card">
<h2>디자인 분야</h2>
<p>3D / VFX / 그래픽 디자인을 기반으로 몰입감 있는 콘텐츠 제작</p>
</div>
<div class="card">
<h2>디자인 키워드</h2>
<table>
<tr><th>번호</th><th>키워드</th></tr>
<tr><td>1</td><td>창의성</td></tr>
<tr><td>2</td><td>몰입감</td></tr>
<tr><td>3</td><td>조화</td></tr>
</table>
</div>
<div class="card">
<h2>디자인의 미래</h2>
<p>인터랙티브와 3D 기반 경험 중심 디자인으로 발전</p>
<a href="#" class="btn">더 알아보기</a>
</div>
</div>
<script>
const cards = document.querySelectorAll('.card');
window.addEventListener('scroll', () => {
    const trigger = window.innerHeight * 0.85;

    cards.forEach(card => {
        const top = card.getBoundingClientRect().top;

        if(top < trigger){
            card.classList.add('show');
        }
    });
});
</script>
</body>
</html>
