<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 소개 - 핑크 에디션</title>
    <style>
        :root {
            --main-pink: #ff85a2;
            --soft-pink: #ffd6e0;
            --deep-pink: #ff6b9a;
            --bg-pink: #fff0f3;
            --text-brown: #5d4046;
        }

        body {
            background-color: var(--bg-pink);
            font-family: 'Pretendard', Verdana, sans-serif;
            color: var(--text-brown);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        /* 중앙 정렬 컨테이너 */
        .wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: var(--deep-pink);
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px white;
        }

        /* 카드 스타일 */
        .card {
            background-color: white;
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(255, 107, 154, 0.1);
            border: 2px solid white;
        }

        h2 {
            color: var(--deep-pink);
            border-bottom: 3px dotted var(--soft-pink);
            display: inline-block;
            margin-bottom: 20px;
        }

        h3 {
            color: var(--main-pink);
            margin-bottom: 15px;
        }

        /* 이미지 스타일 */
        .design-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: block;
            margin: 30px auto;
            border: 8px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover;
        }

        /* 리스트 스타일 */
        ul { list-style: none; padding: 0; }
        ul li {
            background: var(--bg-pink);
            margin: 10px 0;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            color: var(--deep-pink);
        }

        /* 설명 리스트(dl) 스타일 */
        dt { font-weight: bold; color: var(--deep-pink); margin-top: 15px; }
        dd { margin-left: 0; margin-bottom: 10px; font-size: 0.95rem; }

        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
        }

        th { background-color: var(--main-pink); color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid var(--soft-pink); text-align: center; }

        .highlight { color: var(--deep-pink); font
