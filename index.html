<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Pink Portfolio</title>
    <style>
        /* 전문가 느낌의 핑크 톤온톤 변수 */
        :root {
            --bg-base: #fff0f3;        /* 아주 연한 핑크 배경 */
            --main-pink: #ff85a2;      /* 생기 있는 핑크 */
            --deep-pink: #f15c7d;      /* 강조용 진분홍 */
            --point-pink: #ffb8c6;     /* 서브 핑크 */
            --text-color: #5d4046;     /* 가독성 좋은 딥 로즈 브라운 */
            --glass-white: rgba(255, 255, 255, 0.85);
        }

        /* 전체 리셋 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, #ffe3e9 0px, transparent 50%),
                radial-gradient(at 100% 100%, #ffcbd5 0px, transparent 50%);
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: var(--text-color);
            line-height: 1.7;
            padding: 50px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3.5rem;
            color: var(--deep-pink);
            letter-spacing: -2px;
            text-shadow: 4px 4px 0px #ffffff;
        }

        /* 메인 박스 (글래스모피즘) */
        main {
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(255, 133, 162, 0.15);
            border: 2px solid #ffffff;
        }

        section { margin-bottom: 50px; }

        h2 {
            font-size: 1.8rem;
            color: var(--deep-pink);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '🌸';
            font-size: 1.2rem;
        }

        /* 핑크 태그 스타일 */
        .skill-group { display: flex; gap: 12px; flex-wrap: wrap; }
        
        .skill-tag {
            background: white;
            color: var(--main-pink);
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 700;
            border: 2px solid var(--main-pink);
            transition: 0.3s;
        }

        .skill-tag:hover {
            background: var(--main-pink);
            color: white;
            transform: scale(1.1);
        }

        /* 핑크 테이블 스타일 */
        .pink-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--main-pink);
        }

        .pink-table th {
            background: var(--main-pink);
            color: white;
            padding: 15px;
        }

        .pink-table td {
            background: white;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--point-pink);
        }

        /* 푸터 주소 */
        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--deep-pink);
            opacity: 0.8;
        }

        footer a { color: var(--deep-pink); font-weight: bold; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DESIGN LAB</h1>
    </header>

    <main>
        <section>
            <h2>Design Meaning</h2>
            <p>디자인은 <strong>사람의 마음을 움직이는 시각적 언어</strong>입니다. 3D 그래픽과 생동감 넘치는 VFX를 통해 누구나 꿈꾸는 공간을 현실로 구현합니다.</p>
        </section>

        <section>
            <h2>My Core Values</h2>
            <div class="skill-group">
                <span class="skill-tag">전달력</span>
                <span class="skill-tag">가독성</span>
                <span class="skill-tag">스토리텔링</span>
                <span class="skill-tag">몰입감</span>
            </div>
        </section>

        <section>
            <h2>Keyword Chart</h2>
            <table class="pink-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Keyword</th>
                        <th>Effect</th>
                    </tr>
                </thead>

                    <tr><td>01</td><td>Creativity</td><td>무한한 상상력</td></tr>
                    <tr><td>02</td><td>Harmony</td><td>완벽한 색상 조화</td></tr>
